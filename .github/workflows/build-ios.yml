name: Build MAHER iOS Apps

on:
  workflow_dispatch:

env:
  MAHER_SUPABASE_URL: https://oqvcmzqhngzpqipgynby.supabase.co
  MAHER_IOS_VERSION: 1.0.0

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Generate iOS projects
        run: |
          flutter create --platforms=ios --project-name maher_customer --org com.maher customer_app
          flutter create --platforms=ios --project-name maher_professional --org com.maher professional_app
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MAHER Customer" customer_app/ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string MAHER Customer" customer_app/ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MAHER Professional" professional_app/ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string MAHER Professional" professional_app/ios/Runner/Info.plist

      - name: Install customer dependencies
        working-directory: customer_app
        run: flutter pub get

      - name: Install professional dependencies
        working-directory: professional_app
        run: flutter pub get

      - name: Build customer iOS archive (unsigned validation build)
        working-directory: customer_app
        run: |
          flutter build ipa --release --no-codesign \
            --build-name=${{ env.MAHER_IOS_VERSION }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=${{ env.MAHER_SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.MAHER_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build professional iOS archive (unsigned validation build)
        working-directory: professional_app
        run: |
          flutter build ipa --release --no-codesign \
            --build-name=${{ env.MAHER_IOS_VERSION }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=${{ env.MAHER_SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.MAHER_SUPABASE_PUBLISHABLE_KEY }}

      - name: Package unsigned customer iOS artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent customer_app/build/ios/archive/Runner.xcarchive MAHER-Customer-iOS.xcarchive.zip
          if [ -f customer_app/build/ios/ipa/Runner.ipa ]; then cp customer_app/build/ios/ipa/Runner.ipa MAHER-Customer-iOS-unsigned.ipa; fi

      - name: Package unsigned professional iOS artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent professional_app/build/ios/archive/Runner.xcarchive MAHER-Professional-iOS.xcarchive.zip
          if [ -f professional_app/build/ios/ipa/Runner.ipa ]; then cp professional_app/build/ios/ipa/Runner.ipa MAHER-Professional-iOS-unsigned.ipa; fi

      - name: Upload customer iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAHER-Customer-iOS
          path: |
            MAHER-Customer-iOS.xcarchive.zip
            MAHER-Customer-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Upload professional iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAHER-Professional-iOS
          path: |
            MAHER-Professional-iOS.xcarchive.zip
            MAHER-Professional-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Check Apple signing configuration
        id: apple_config
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CUSTOMER_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_CUSTOMER_BASE64 }}
          PROFESSIONAL_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_PROFESSIONAL_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          ASC_KEY_B64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          signing_ready=false
          upload_ready=false
          if [[ -n "${CERT_B64:-}" && -n "${CERT_PASSWORD:-}" && -n "${CUSTOMER_PROFILE_B64:-}" && -n "${PROFESSIONAL_PROFILE_B64:-}" && -n "${TEAM_ID:-}" && -n "${SIGNING_CERTIFICATE:-}" ]]; then
            signing_ready=true
          fi
          if [[ "$signing_ready" == true && -n "${ASC_KEY_B64:-}" && -n "${ASC_KEY_ID:-}" && -n "${ASC_ISSUER_ID:-}" ]]; then
            upload_ready=true
          fi
          echo "signing_ready=$signing_ready" >> "$GITHUB_OUTPUT"
          echo "upload_ready=$upload_ready" >> "$GITHUB_OUTPUT"

      - name: Import Apple distribution certificate
        if: steps.apple_config.outputs.signing_ready == 'true'
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          printf '%s' "$CERT_B64" | base64 -D > "$RUNNER_TEMP/apple_distribution.p12"
          security import "$RUNNER_TEMP/apple_distribution.p12" -k build.keychain-db -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db

      - name: Install provisioning profiles
        if: steps.apple_config.outputs.signing_ready == 'true'
        env:
          CUSTOMER_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_CUSTOMER_BASE64 }}
          PROFESSIONAL_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_PROFESSIONAL_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$CUSTOMER_PROFILE_B64" | base64 -D > "$RUNNER_TEMP/customer.mobileprovision"
          printf '%s' "$PROFESSIONAL_PROFILE_B64" | base64 -D > "$RUNNER_TEMP/professional.mobileprovision"
          cp "$RUNNER_TEMP/customer.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/customer.mobileprovision"
          cp "$RUNNER_TEMP/professional.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/professional.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/customer.mobileprovision" > "$RUNNER_TEMP/customer_profile.plist"
          security cms -D -i "$RUNNER_TEMP/professional.mobileprovision" > "$RUNNER_TEMP/professional_profile.plist"
          echo "CUSTOMER_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/customer_profile.plist")" >> "$GITHUB_ENV"
          echo "PROFESSIONAL_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/professional_profile.plist")" >> "$GITHUB_ENV"

      - name: Archive signed customer app for App Store Connect
        if: steps.apple_config.outputs.signing_ready == 'true'
        working-directory: customer_app
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath "$PWD/build/ios/archive/MAHER-Customer.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="com.maher.customer" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_CERTIFICATE" \
            PROVISIONING_PROFILE_SPECIFIER="$CUSTOMER_PROFILE_NAME" archive

      - name: Archive signed professional app for App Store Connect
        if: steps.apple_config.outputs.signing_ready == 'true'
        working-directory: professional_app
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos \
            -archivePath "$PWD/build/ios/archive/MAHER-Professional.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="com.maher.professional" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_CERTIFICATE" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFESSIONAL_PROFILE_NAME" archive

      - name: Export signed customer IPA
        if: steps.apple_config.outputs.signing_ready == 'true'
        working-directory: customer_app
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/customer_export_options.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingCertificate</key><string>${SIGNING_CERTIFICATE}</string>
          <key>provisioningProfiles</key><dict><key>com.maher.customer</key><string>${CUSTOMER_PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/build/ios/archive/MAHER-Customer.xcarchive" \
            -exportPath "$PWD/build/ios/export" -exportOptionsPlist "$RUNNER_TEMP/customer_export_options.plist"
          cp "$PWD/build/ios/export/Runner.ipa" "$GITHUB_WORKSPACE/MAHER-Customer-TestFlight.ipa"

      - name: Export signed professional IPA
        if: steps.apple_config.outputs.signing_ready == 'true'
        working-directory: professional_app
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/professional_export_options.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>signingCertificate</key><string>${SIGNING_CERTIFICATE}</string>
          <key>provisioningProfiles</key><dict><key>com.maher.professional</key><string>${PROFESSIONAL_PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/build/ios/archive/MAHER-Professional.xcarchive" \
            -exportPath "$PWD/build/ios/export" -exportOptionsPlist "$RUNNER_TEMP/professional_export_options.plist"
          cp "$PWD/build/ios/export/Runner.ipa" "$GITHUB_WORKSPACE/MAHER-Professional-TestFlight.ipa"

      - name: Upload signed iOS artifacts
        if: steps.apple_config.outputs.signing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MAHER-iOS-Signed-${{ github.run_number }}
          path: |
            MAHER-Customer-TestFlight.ipa
            MAHER-Professional-TestFlight.ipa
          if-no-files-found: error

      - name: Prepare App Store Connect API key
        if: steps.apple_config.outputs.upload_ready == 'true'
        env:
          ASC_KEY_B64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Upload customer build to App Store Connect
        if: steps.apple_config.outputs.upload_ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app --file MAHER-Customer-TestFlight.ipa --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --file MAHER-Customer-TestFlight.ipa --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload professional build to App Store Connect
        if: steps.apple_config.outputs.upload_ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app --file MAHER-Professional-TestFlight.ipa --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --file MAHER-Professional-TestFlight.ipa --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

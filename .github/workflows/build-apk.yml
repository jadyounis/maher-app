name: Build MAHER Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Generate Android projects
        run: |
          flutter create --platforms=android --project-name maher_customer customer_app
          flutter create --platforms=android --project-name maher_professional professional_app
      - name: Build customer APK
        working-directory: customer_app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Build professional APK
        working-directory: professional_app
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: MAHER-Customer-APK
          path: customer_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload professional APK
        uses: actions/upload-artifact@v4
        with:
          name: MAHER-Professional-APK
          path: professional_app/build/app/outputs/flutter-apk/app-release.apk
